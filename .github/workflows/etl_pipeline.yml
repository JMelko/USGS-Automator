name: USGS Daily ETL Pipeline

# The Alarm Clock
on:
  schedule:
    # GitHub servers run on UTC time. 9:00 AM UTC is exactly 2:00 AM MST.
    - cron: '0 9 * * *' 
  workflow_dispatch: # This adds a manual "Run Workflow" button on your GitHub page!

# Give the bot permission to push code back to your repository
permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest # The temporary cloud machine

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Execute Pipeline
      run: python scripts/usgs_pipeline.py

    - name: 5. Commit and Push the New Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/processed/san_pedro_flow.csv
        git add data/pipeline.log
        # The '|| echo' prevents the pipeline from failing if no new data was downloaded
        git commit -m "Automated data pull: $(date +'%Y-%m-%d')" || echo "No new data to commit"
        git push