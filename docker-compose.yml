services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: usgs_postgis
    environment:
      POSTGRES_USER: env_analyst
      POSTGRES_PASSWORD: tucson_water
      POSTGRES_DB: usgs_water_data
    ports:
      - "5433:5432"
    volumes:
      # Persistent data storage (prevents data loss if container dies)
      - usgs_postgis_data:/var/lib/postgresql/data
      # Map our local sql folder to the container's auto-init directory
      - ./sql:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  usgs_postgis_data: